<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      .el--1 {
        background-color: blueviolet;
      }
      .el--2 {
        background-color: orangered;
      }
      .el--3 {
        background-color: green;
        height: 150px; /*height of the flexbox is decided by the max height of any of its children*/
      }
      .el--4 {
        background-color: goldenrod;
      }
      .el--5 {
        background-color: palevioletred;
      }
      .el--6 {
        background-color: steelblue;
      }
      .el--7 {
        background-color: yellow;
      }
      .el--8 {
        background-color: crimson;
      }

      .container {
        /* STARTER */
        font-family: sans-serif;
        background-color: #ddd;
        font-size: 32px;
        margin: 40px;

        /* FLEXBOX */
        display:flex; /*to implement flexbox model*/
        align-items: center; /*will align elements along the cross axis(vertically) center wrt to the container*/
        /*justify-content: center; will align elements along main axis (horizontally) center wrt to the container*/
        justify-content:flex-start; /*will align elements along left of the main axis (horizontally left) wrt to the container*/
         gap:20px; /*to set gap btwn elements without margins*/
      }
      .el{
        /* margin-right:30px; 
        defaults:
        flex-grow:0;
        flex-shrink:1; elements can't outgrow the container
        flex-basis:auto;
        the above three line is equivalent to 
        flex:0 1 200px;
         */
         /* flex-basis:200px; */
         /* flex-shrink:0;
         flex-grow:1;  width of all elements equal and container is filled completely by them */
         flex:1 0 200px; 

      } 
      .el--1{
        align-self:flex-start; /*to align individual flex item*/
        /* flex-grow:1;
        flex-grow:2; will get double of the available empty space as compared to other elements if they are set to flex-grow:1; rather having width as double*/
      }
      .el--5{
        align-self:stretch; 
        order:1;
      }
      .el--6{
        align-self: stretch;
        order:-1;
      }
      
    </style>
  </head>
  <body>
    <div class="container">
      <div class="el el--1">HTML</div> <!-- child elements of the flex container aka flex items .Number of flex items will be equal to the number of child the parent have and not equal the individual elements inside the parent element.Only direct child of parent or flex container are taken to a flex item-->
      <div class="el el--2">and</div>
      <div class="el el--3">CSS</div>
      <div class="el el--4">are</div>
      <div class="el el--5">amazing</div>
      <!-- <div class="el el--6">languages</div>
      <div class="el el--7">to</div>
      <div class="el el--8">learn</div> -->
    </div>
  </body>
</html>
