<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Grid</title>
  <style>
    .el--1 {
      background-color: blueviolet;
    }

    .el--2 {
      background-color: orangered;
    }

    .el--3 {
      background-color: green;
      height: 150px; /*this height of the item will be fixed independent of the css grid item height applied to it*/
    }

    .el--4 {
      background-color: goldenrod;
    }

    .el--5 {
      background-color: palevioletred;
    }

    .el--6 {
      background-color: steelblue;
    }

    .el--7 {
      background-color: yellow;
    }

    .el--8 {
      background-color: crimson;
    }

    .container--1 {
      /* STARTER */
       
      font-family: sans-serif;
      background-color: #ddd;
      font-size: 40px;
      margin: 40px;
      /* CSS GRID */
      display: grid;
      /*grid-template-columns:200px 200px 1fr 100px; use to define no of columns using no of widths. Her fr is another unit which is use to give flexible size to the grid item to fill all the remaining empty space of the container*/
      /* grid-template-columns:2fr 1fr 1fr auto; auto takes width exactly the space needed by the grid item*/
      grid-template-columns: repeat(4, 1fr);
      /*same as 1fr 1fr 1fr 1fr*/
      /*grid-template-rows:300px 200px;use to define no of rows using no of heights*/
      /* height:500px; */
      grid-template-rows: 1fr 1fr;
      /* grid-template-rows:1fr auto; */
      /* column-gap: 30px; will create gap btwn columns
        row-gap: 30px;  will create gap btwn rows*/
      gap: 40px 20px;
      /*first value is for row and second for column-gap , only way to define gap btwn the grid items row and columnn wise both aka grid-gap*/
      
      display: none;/*all the declaration block's effect on the web page will be removed same as commenting it */
    }

    .el--8 {  /*placing grid item to different cell*/
      grid-column: 2/3;
      /*meaning the item should begin from column grid line 2 and end at column line 3,that is,2nd column*/
      grid-row: 1/2;
      /*meaning the item should begin from grid row line 1 and end at row line 2,that is,1st row*/
    }
    .el--2{
      /* grid-column: 1/2; if second value in grid-column or row is just 1 greater than the 1st then u can remove it also and that will just work fine
      grid-row: 2/3;*/
      /* grid-column: 1; */
      /* grid-column: 1/4; start from grid line 1 and end at 4*/ 
      /* grid-column: 1/span 3; start from grid line 1 and expand to next 3 lines that grid line 4,equivalent to above line */
      grid-column:2/-1; /*start from line 2 to the end grid column line*/
      grid-row: 2; 
    } 
    .container--2 {
     
      /* STARTER */
      font-family: sans-serif;
      background-color: black;
      font-size: 40px;
      margin: 40px;

      width: 700px;
      height: 600px;
      gap:50px;
      /* CSS GRID */
      display: grid;
      grid-template-columns: 125px 200px 125px;
      grid-template-rows: 250px 100px;
      
      /* aligning tracks inside container:distributing empty space*/
      justify-content: center;/*to align track centrally along row*/
      align-content:center; /*to align track centrally along column*/
      
      /* Aligning items inside cells:moving items around inside cells */
      align-items:center;
      justify-items: center;
    }
    .el--3{
      align-self: end;
      justify-self: end;
    }
  </style>
</head>

<body>
  <div class="container--1">
    <div class="el el--1">(1) HTML</div>
    <div class="el el--2">(2) and</div>
    <div class="el el--3">(3) CSS</div>
    <div class="el el--4">(4) are</div>
    <div class="el el--5">(5) amazing</div>
    <div class="el el--6">(6) languages</div>
    <div class="el el--7">(7) to</div>
    <div class="el el--8">(8) learn</div>
  </div>

  <div class="container--2">
    <div class="el el--1">(1)</div>
    <div class="el el--3">(3)</div>
    <div class="el el--4">(4)</div>
    <div class="el el--5">(5)</div>
    <div class="el el--6">(6)</div>
    <div class="el el--7">(7)</div>
  </div>
</body>

</html>
